name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# Pinned to the exact toolchain the code is validated against. The macos
# targets are cross-compiled on linux (zig bundles the macOS libc stubs).
env:
  ZIG_VERSION: 0.17.0-dev.2131+d08989840
  ZIG_URL: https://ziglang.org/builds/zig-x86_64-linux-0.17.0-dev.2131+d08989840.tar.xz

jobs:
  release-linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "$ZIG_URL" -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Build
        run: |
          chmod +x $(which zig) 2>/dev/null || true
          zig build -Dtarget=${{ matrix.target }} -Drelease=true -Denable-sqlite=false
          mkdir -p release
          cp zig-out/bin/knot3bot release/knot3bot-${{ matrix.target }}
          ls -lh release/
      - uses: actions/upload-artifact@v4
        with:
          name: knot3bot-${{ matrix.target }}
          path: release/*

  release-macos:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-macos-none
          - aarch64-macos-none
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "$ZIG_URL" -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Build (cross-compile)
        run: |
          zig build -Dtarget=${{ matrix.target }} -Drelease=true -Denable-sqlite=false
          mkdir -p release
          cp zig-out/bin/knot3bot release/knot3bot-${{ matrix.target }}
          ls -lh release/
      - uses: actions/upload-artifact@v4
        with:
          name: knot3bot-${{ matrix.target }}
          path: release/*

  create-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [release-linux, release-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker
    runs-on: ubuntu-24.04
    needs: [release-linux, release-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "$ZIG_URL" -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
      - name: Build static binary for the alpine runtime image
        run: |
          zig build -Dtarget=x86_64-linux-musl -Drelease=true -Denable-sqlite=false
          mkdir -p docker
          cp zig-out/bin/knot3bot docker/knot3bot
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest

  npm-publish:
    name: npm
    runs-on: ubuntu-24.04
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: cd npm && npm publish --access public
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
