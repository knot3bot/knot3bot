name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]

# Pinned to the exact toolchain the code is validated against (a master
# snapshot; released 0.16.0 is too old for these APIs). The tarball URL is
# the linux build of that snapshot — see the version check step below.
env:
  ZIG_VERSION: 0.17.0-dev.2131+d08989840
  ZIG_URL: https://ziglang.org/builds/zig-x86_64-linux-0.17.0-dev.2131+d08989840.tar.xz

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "$ZIG_URL" -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build
        run: zig build

      - name: Run tests
        run: zig build test

      - name: End-to-end smoke (mock LLM)
        run: ./scripts/e2e_mock.sh 8123
        env:
          E2E_BOT_LOG: /tmp/knot3bot_e2e_bot.log

      - name: Build benchmark
        run: zig build benchmark

      - name: Run benchmark
        run: ./zig-out/bin/benchmark 2>&1 | tee benchmark.log

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark.log

      - name: Build release
        run: zig build -Drelease=true
